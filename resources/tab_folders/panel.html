<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab folders</title>
  <link rel="stylesheet" href="panel.css">
  <script type="module" src="panel.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="folder" viewBox="0 0 24 24"><path d="M3 8V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="folder-open" viewBox="0 0 24 24"><path d="M3 17V6a2 2 0 0 1 2-2h5l2 3h6a2 2 0 0 1 2 2"/><path d="M3 19l2.5-8h16L19 19a1.5 1.5 0 0 1-1.5 1H4.5Z"/></symbol>
    <symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><ellipse cx="12" cy="12" rx="3.8" ry="8.2"/><path d="M4 12h16"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="next" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
    <symbol id="more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.5"/></symbol>
  </svg>
  <main>
    <header><h1>Folders</h1><button id="new-folder" class="icon-button" title="New folder" aria-label="New folder"><svg><use href="#plus"/></svg></button></header>
    <div id="folders" role="tree" aria-label="Folders"></div>
    <p id="empty" hidden>Create a folder, then drag tabs into it.</p>
    <section id="open">
      <h2>Open tabs</h2>
      <div id="tabs" role="tree" aria-label="Open tabs"></div>
    </section>
  </main>
  <div id="menu" role="menu" hidden></div>
  <dialog id="move-dialog">
    <form method="dialog">
      <label for="destination">Move to</label>
      <select id="destination"></select>
      <footer><button value="cancel">Cancel</button><button value="move">Move</button></footer>
    </form>
  </dialog>
  <div id="status" role="alert" hidden></div>
</body>
</html>
